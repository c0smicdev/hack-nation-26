# Paid 2 GiB service. Review Render's price before approving deployment.
services:
  - type: web
    name: socrates-presidio
    runtime: docker
    region: frankfurt
    plan: 1c-2g
    numInstances: 1
    dockerfilePath: ./privacy/Dockerfile
    dockerContext: ./privacy
    healthCheckPath: /ready
    autoDeployTrigger: off
    envVars:
      - key: SOCRATES_PRIVACY_TOKEN
        generateValue: true
      - key: SOCRATES_PRIVACY_ALIAS_KEY
        generateValue: true
      - key: OMP_THREAD_LIMIT
        value: "1"
    buildFilter:
      paths:
        - privacy/**
        - render.yaml
